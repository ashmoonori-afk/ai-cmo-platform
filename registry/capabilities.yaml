version: 1
description: AI CMO Platform capability registry — single machine-readable source for agents, playbooks, and natural-language
  dispatch mapping. Any CLI/agent harness reads this file to dispatch work. Synced with CLAUDE.md tables by tests/test_capabilities_registry.py.
agents:
- name: community-manager
  role: Reddit/Hacker News 기회 발굴, 커뮤니티 톤 초안
  model: sonnet
  path: agents/community-manager.md
- name: competitor
  role: 경쟁사 분석
  model: opus
  path: agents/competitor.md
- name: copywriter
  role: 블로그/SNS/뉴스레터/케이스스터디 작성
  model: sonnet
  path: agents/copywriter.md
- name: data-analyst
  role: 매출/성과 데이터 분석, 인사이트 추출
  model: opus
  path: agents/data-analyst.md
- name: designer
  role: 랜딩페이지/상세페이지 디자인, 디자인 감사
  model: sonnet
  path: agents/designer.md
- name: growth-engineer
  role: 기술적 SEO 수정·사이트 개선 코드 실행
  model: sonnet
  path: agents/growth-engineer.md
- name: reporter
  role: 주간/월간 리포트, KB 업데이트, 회의록
  model: sonnet
  path: agents/reporter.md
- name: repurposer
  role: 콘텐츠 1개 → 멀티 포맷 변환
  model: haiku
  path: agents/repurposer.md
- name: researcher
  role: 시장/업종/기업 리서치
  model: opus
  path: agents/researcher.md
- name: reviewer
  role: 모든 산출물 품질 검증
  model: sonnet
  path: agents/reviewer.md
- name: sales-writer
  role: 콜드메일, 제안서, 미팅 브리프, 피칭덱
  model: sonnet
  path: agents/sales-writer.md
- name: seo-specialist
  role: 키워드 리서치, SEO/GEO 감사, 콘텐츠 최적화
  model: sonnet
  path: agents/seo-specialist.md
- name: strategist
  role: 전략 수립 (GTM, 포지셔닝, 퍼널 등)
  model: opus
  path: agents/strategist.md
modules:
  00-chains: chains
  01-strategy: strategy
  02-intelligence: intelligence
  03-content: content
  04-sales: sales
  05-seo: seo
  06-analytics: analytics
  07-operations: operations
  08-design: design
  08-role-sops: role-sops
  09-local: local
  10-ads: ads
  11-community: community
output_pattern: outputs/{client}/{module}/{YYYYMMDD}_{제목}.md
engine_artifacts: artifacts/{run_id}/ (aicmo run 실행물, gitignore)

{% extends "store_app/base.html" %}{% block content %}<h1>{{ store.name }}의 소식 만들기</h1><p class="muted">AI가 초안을 작성합니다. 사장님 확인과 최종 검토 후 파일로 저장할 수 있어요.</p>
<section class="card"><form method="post">{% csrf_token %}{{ form.as_p }}<p>사진 첨부와 문안 편집 화면은 준비 중입니다. 현재는 사진 없는 소식 1건과 제공 리뷰의 답글을 만듭니다.</p>
<p>사용 가능한 건수는 운영자가 설정합니다. 접수 뒤 한도가 부족하면 실패 상태로 안내됩니다.</p><div class="actions"><button>문안 작성 요청</button><a href="{% url 'home' %}">오늘로 돌아가기</a></div></form></section>{% endblock %}
